name: Update Wetteronline GIF

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ImageMagick installieren
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Wetteronline-Radar laden
        run: |
          npm install puppeteer
          cat > wo_screenshot.js << 'EOF'
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1920, height: 1080 });
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36');

            await page.goto('https://www.wetteronline.de/wetterradar?wrg=10382&wrx=52.63,12.75&wry=52.504,13.305&wrn=QmVybGlu&wrm=8.67', {
              waitUntil: 'networkidle2',
              timeout: 60000
            });
            await new Promise(r => setTimeout(r, 3000));

            const consentFrame = page.frames().find(f => f.url().includes('cmp.wetteronline.de'));

            if (consentFrame) {
              const clicked = await consentFrame.evaluate(() => {
                const exactKeywords = ['ok', 'akzeptieren', 'zustimmen', 'einverstanden'];
                const containsKeywords = ['alle akzeptieren', 'accept all', 'ich stimme zu', 'akzeptieren & weiter', 'akzeptieren und weiter'];
                const buttons = Array.from(document.querySelectorAll('button, a'));
                for (const btn of buttons) {
                  const text = (btn.innerText || '').trim().toLowerCase();
                  if (exactKeywords.includes(text) || containsKeywords.some(k => text.includes(k))) {
                    btn.click();
                    return text;
                  }
                }
                return null;
              });
              console.log('Geklickter Button-Text im Consent-Frame:', clicked);
            } else {
              console.log('Kein Consent-Frame gefunden.');
            }

            await new Promise(r => setTimeout(r, 8000));

            await page.screenshot({ path: 'docs/wetteronline.jpg', type: 'jpeg', quality: 85 });
            await browser.close();
          })();
          EOF
          mkdir -p docs
          node wo_screenshot.js
          file docs/wetteronline.jpg

      - name: Wetteronline-Zeitstempel berechnen, zuschneiden und einfügen
        run: |
          NOW_EPOCH=$(date -u +%s)
          ROUNDED_EPOCH=$(( NOW_EPOCH - (NOW_EPOCH % 300) ))
          RAW_TEXT=$(TZ='Europe/Berlin' date -d @${ROUNDED_EPOCH} +"%H:%M")
          echo "Berechneter Zeitstempel: $RAW_TEXT"

          convert docs/wetteronline.jpg -crop 680x510+772+459 +repage docs/wetteronline.jpg

          convert -size 96x46 xc:black -fill white -gravity center -pointsize 35 -annotate 0 "$RAW_TEXT" /tmp/wo_time_box.png
          convert docs/wetteronline.jpg /tmp/wo_time_box.png -gravity SouthEast -geometry +0+24 -composite docs/wetteronline.jpg

      - name: Wetteronline-Frame speichern
        run: |
          mkdir -p wetteronline_frames
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          cp docs/wetteronline.jpg "wetteronline_frames/frame_${TIMESTAMP}.jpg"
          ls -1 wetteronline_frames/frame_*.jpg | sort | head -n -8 | xargs -r rm --

      - name: Wetteronline-GIF bauen
        run: |
          ALL=$(ls -1 wetteronline_frames/frame_*.jpg | sort)
          LAST=$(echo "$ALL" | tail -n 1)
          REST=$(echo "$ALL" | head -n -1)
          convert -delay 100 -loop 0 $REST -delay 200 "$LAST" docs/wetteronline.gif
          touch docs/.nojekyll

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs wetteronline_frames
          git commit -m "Update Wetteronline GIF" || echo "Keine Änderungen"
          git pull --rebase origin main

          for i in 1 2 3; do
            if git push; then
              echo "Push erfolgreich."
              break
            else
              echo "Push fehlgeschlagen (Versuch $i), warte 10 Sekunden..."
              sleep 10
            fi
          done
