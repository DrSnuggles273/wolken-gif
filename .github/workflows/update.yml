name: Update Wolken GIF

on:
  
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: ImageMagick installieren
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Bild laden und zuschneiden
        run: |
          mkdir -p frames docs
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          LOCALTIME=$(TZ='Europe/Berlin' date +"%H:%M")
          curl -s -A "Mozilla/5.0" -o "frames/orig_${TIMESTAMP}.png" "https://www.dwd.de/DWD/wetter/sat/satwetter/njob_satrad.png"
          convert "frames/orig_${TIMESTAMP}.png" -crop 160x120+536+220 +repage "frames/frame_${TIMESTAMP}.png"
          convert "frames/frame_${TIMESTAMP}.png" -filter Lanczos -resize 400% "frames/frame_${TIMESTAMP}.png"
          convert -size 54x22 xc:black -fill white -gravity center -pointsize 18 -annotate 0 "$LOCALTIME" "frames/time_${TIMESTAMP}.png"
          convert "frames/frame_${TIMESTAMP}.png" "frames/time_${TIMESTAMP}.png" -gravity SouthEast -geometry +24+24 -composite "frames/frame_${TIMESTAMP}.png"
          rm "frames/orig_${TIMESTAMP}.png" "frames/time_${TIMESTAMP}.png"

      - name: Nur die letzten 8 Frames behalten
        run: |
          cd frames
          ls -1 frame_*.png | sort | head -n -8 | xargs -r rm --

      - name: GIF bauen
        run: |
          ALL=$(ls -1 frames/frame_*.png | sort)
          LAST=$(echo "$ALL" | tail -n 1)
          REST=$(echo "$ALL" | head -n -1)
          convert -delay 100 -loop 0 $REST -delay 200 "$LAST" docs/wolken.gif
          touch docs/.nojekyll

      - name: FU-Berlin Webcam (Dahlem NNO) laden
        run: |
          mkdir -p docs
          PAGE_URL="https://wind.met.fu-berlin.de/webcams/5"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"

          # Alle auf der Seite gelisteten Dateinamen einsammeln, neueste zuerst
          FILES=$(curl -s -A "$UA" -H "Referer: $PAGE_URL" "$PAGE_URL" \
            | grep -oE 'webcam_metfubcm02_[0-9]{8}_[0-9]{4}\.jpg' \
            | sort -u -r)

          if [ -z "$FILES" ]; then
            echo "Konnte keine Dateinamen auf der Seite finden."
          else
            FOUND=0
            for F in $FILES; do
              URL="https://wind.met.fu-berlin.de/storage/webcams/metfubcm02/${F}"
              STATUS=$(curl -s -o /tmp/webcam.jpg -w "%{http_code}" \
                -A "$UA" -H "Referer: $PAGE_URL" \
                -H "Accept: image/avif,image/webp,image/apng,image/*,*/*;q=0.8" \
                "$URL")
              echo "Probiere $F -> HTTP $STATUS"
              if [ "$STATUS" == "200" ]; then
                cp /tmp/webcam.jpg docs/webcam_dahlem_nno.jpg
                echo "Verwendet: $URL"
                FOUND=1
                break
              fi
            done
            if [ "$FOUND" == "0" ]; then
              echo "Keines der gelisteten Bilder war abrufbar, docs/webcam_dahlem_nno.jpg bleibt unverändert."
            fi
          fi

      - name: EUMETSAT-Bild laden (30 Min. Verzögerung, Europa)
        run: |
          mkdir -p docs
          OLDER_TIME=$(date -u -d "30 minutes ago" +"%Y-%m-%dT%H:%M:%S.000Z")
          LOCALTIME=$(TZ='Europe/Berlin' date -d "30 minutes ago" +"%H:%M")
          echo "Angefragter Zeitpunkt: $OLDER_TIME"

          URL="https://view.eumetsat.int/geoserver/wms?service=WMS&version=1.3.0&request=GetMap&layers=mtg_fd:rgb_geocolour&styles=&crs=EPSG:4326&bbox=35.0,-25.0,60.0,37.5&width=1250&height=500&format=image/jpeg&time=${OLDER_TIME}"
          curl -sL -o "docs/eumetsat.jpg" "$URL"

          convert docs/eumetsat.jpg \
            -fill black -draw "rectangle 1152,344 1232,380" \
            -fill white -pointsize 28 -annotate +1156+372 "$LOCALTIME" \
            docs/eumetsat.jpg

          file "docs/eumetsat.jpg"
          
