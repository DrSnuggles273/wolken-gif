      - name: Meteosat-Aktualität prüfen und ggf. benachrichtigen
        run: |
          LATEST=$(curl -s -A "Mozilla/5.0" "https://slider.cira.colostate.edu/data/json/meteosat-12/full_disk/geocolor/latest_times.json?_=$(date +%s)" | grep -oE '[0-9]{14}' | sort -n | tail -1)
          LATEST_EPOCH=$(date -u -d "${LATEST:0:8} ${LATEST:8:2}:${LATEST:10:2}:${LATEST:12:2}" +%s)
          NOW_EPOCH=$(date -u +%s)
          AGE=$(( (NOW_EPOCH - LATEST_EPOCH) / 60 ))
          echo "Neuester Meteosat-Zeitstempel: $LATEST (Alter: ${AGE} Minuten)"

          if [ "$AGE" -lt 60 ]; then
            if [ ! -f docs/.meteosat_notified ]; then
              curl -s -d "Meteosat-Live-Bild ist wieder aktuell! (Stand: $LATEST)" "https://ntfy.sh/ringo-meteosat-check-2026"
              touch docs/.meteosat_notified
              echo "Benachrichtigung gesendet."
            else
              echo "Bereits benachrichtigt, überspringe."
            fi
          else
            rm -f docs/.meteosat_notified
            echo "Weiterhin veraltet, keine Aktion."
          fi
             
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Meteoblue-Karte per Screenshot laden
        run: |
          npm install puppeteer
          cat > screenshot.js << 'EOF'
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            await page.goto('https://www.meteoblue.com/de/wetter/maps/charlottenburg_deutschland_2940187#coords=7.14/52.433/13.734&map=satellite~radar~none~none~none', {
              waitUntil: 'networkidle2',
              timeout: 60000
            });

            await new Promise(r => setTimeout(r, 2000));

            const clicked = await page.evaluate(() => {
              const exactKeywords = ['ok', 'akzeptieren', 'zustimmen', 'einverstanden'];
              const containsKeywords = ['alle akzeptieren', 'accept all', 'ich stimme zu'];
              const buttons = Array.from(document.querySelectorAll('button, a'));
              for (const btn of buttons) {
                const text = (btn.innerText || '').trim().toLowerCase();
                if (exactKeywords.includes(text) || containsKeywords.some(k => text.includes(k))) {
                  btn.click();
                  return text;
                }
              }
              return null;
            });
            console.log('Geklickter Button-Text:', clicked);

            await new Promise(r => setTimeout(r, 8000));

            await page.screenshot({ path: 'docs/meteoblue.jpg', type: 'jpeg', quality: 85 });
            await browser.close();
          })();
          EOF
          node screenshot.js
          file docs/meteoblue.jpg

      - name: Tesseract OCR installieren
        run: sudo apt-get install -y tesseract-ocr

      - name: Meteoblue-Zeitstempel auslesen, zuschneiden und einfügen
        run: |
          convert docs/meteoblue.jpg -crop 44x24+928+674 +repage /tmp/time_crop.png
          convert /tmp/time_crop.png -resize 400% -colorspace Gray -threshold 50% /tmp/time_crop_processed.png
          RAW_TEXT=$(tesseract /tmp/time_crop_processed.png - 2>/dev/null | tr -d '[:space:]')
          echo "Erkannter Text: $RAW_TEXT"

          if ! echo "$RAW_TEXT" | grep -qE '^[0-9]{1,2}:[0-9]{2}$'; then
            RAW_TEXT=$(TZ='Europe/Berlin' date +"%H:%M")
            echo "OCR-Ergebnis unplausibel, nutze aktuelle Uhrzeit als Fallback: $RAW_TEXT"
          fi

          convert docs/meteoblue.jpg -crop 360x270+315+193 +repage docs/meteoblue.jpg

          convert -size 52x26 xc:black -fill white -gravity center -pointsize 18 -annotate 0 "$RAW_TEXT" /tmp/time_box.png
          convert docs/meteoblue.jpg /tmp/time_box.png -gravity SouthEast -geometry +0+20 -composite docs/meteoblue.jpg
            
      - name: Meteoblue-Frame speichern
        run: |
          mkdir -p meteoblue_frames
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          cp docs/meteoblue.jpg "meteoblue_frames/frame_${TIMESTAMP}.jpg"
          ls -1 meteoblue_frames/frame_*.jpg | sort | head -n -8 | xargs -r rm --

      - name: Meteoblue-GIF bauen
        run: |
          ALL=$(ls -1 meteoblue_frames/frame_*.jpg | sort)
          LAST=$(echo "$ALL" | tail -n 1)
          REST=$(echo "$ALL" | head -n -1)
          convert -delay 100 -loop 0 $REST -delay 200 "$LAST" docs/meteoblue.gif

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frames docs meteoblue_frames
          git commit -m "Update Wolken GIF" || echo "Keine Änderungen"
          git pull --rebase origin main

          for i in 1 2 3; do
            if git push; then
              echo "Push erfolgreich."
              break
            else
              echo "Push fehlgeschlagen (Versuch $i), warte 10 Sekunden..."
              sleep 10
            fi
          done
