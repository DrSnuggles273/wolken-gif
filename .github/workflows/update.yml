name: Update Wolken GIF

on:
  
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: ImageMagick installieren
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Bild laden und zuschneiden
        run: |
          mkdir -p frames docs
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          LOCALTIME=$(TZ='Europe/Berlin' date +"%H:%M")
          curl -s -A "Mozilla/5.0" -o "frames/orig_${TIMESTAMP}.png" "https://www.dwd.de/DWD/wetter/sat/satwetter/njob_satrad.png"
          convert "frames/orig_${TIMESTAMP}.png" -crop 140x140+540+220 +repage "frames/frame_${TIMESTAMP}.png"
          convert -size 40x16 xc:black -fill white -gravity center -pointsize 12 -annotate 0 "$LOCALTIME" "frames/time_${TIMESTAMP}.png"
          convert "frames/frame_${TIMESTAMP}.png" "frames/time_${TIMESTAMP}.png" -gravity SouthEast -geometry +0+24 -composite "frames/frame_${TIMESTAMP}.png"
          rm "frames/orig_${TIMESTAMP}.png" "frames/time_${TIMESTAMP}.png"

      - name: Nur die letzten 8 Frames behalten
        run: |
          cd frames
          ls -1 frame_*.png | sort | head -n -8 | xargs -r rm --

      - name: GIF bauen
        run: |
          ALL=$(ls -1 frames/frame_*.png | sort)
          LAST=$(echo "$ALL" | tail -n 1)
          REST=$(echo "$ALL" | head -n -1)
          convert -delay 100 -loop 0 $REST -delay 200 "$LAST" docs/wolken.gif
          touch docs/.nojekyll

      - name: EUMETSAT-Bild laden
        env:
          EUMETSAT_KEY: ${{ secrets.EUMETSAT_KEY }}
          EUMETSAT_SECRET: ${{ secrets.EUMETSAT_SECRET }}
        run: |
          mkdir -p docs
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          CREDS=$(echo -n "${EUMETSAT_KEY}:${EUMETSAT_SECRET}" | base64 -w 0)
          TOKEN_RESPONSE=$(curl -s -k -d "grant_type=client_credentials" \
            -H "Authorization: Basic ${CREDS}" \
            "https://api.eumetsat.int/token")
          TOKEN=$(echo "$TOKEN_RESPONSE" | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)

          URL="https://view.eumetsat.int/geoserver/wms?service=WMS&version=1.3.0&request=GetMap&layers=mtg_fd:rgb_geocolour&styles=&crs=EPSG:4326&bbox=52.3,13.0,52.7,13.8&width=400&height=300&format=image/png&time=${NOW}&access_token=${TOKEN}"
          echo "Angefragte URL: $URL"

          echo "--- Volle Server-Antwort (Header + Body) ---"
          curl -s -k -D - "$URL" -o docs/eumetsat.png
          
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frames docs
          git commit -m "Update Wolken GIF" || echo "Keine Änderungen"
          git push
