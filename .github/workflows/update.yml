name: Update Wolken GIF

on:
  
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: ImageMagick installieren
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Bild laden und zuschneiden
        run: |
          mkdir -p frames docs
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          LOCALTIME=$(TZ='Europe/Berlin' date +"%H:%M")
          curl -s -A "Mozilla/5.0" -o "frames/orig_${TIMESTAMP}.png" "https://www.dwd.de/DWD/wetter/sat/satwetter/njob_satrad.png"
          convert "frames/orig_${TIMESTAMP}.png" -crop 140x140+540+220 +repage "frames/frame_${TIMESTAMP}.png"
          convert -size 40x16 xc:black -fill white -gravity center -pointsize 12 -annotate 0 "$LOCALTIME" "frames/time_${TIMESTAMP}.png"
          convert "frames/frame_${TIMESTAMP}.png" "frames/time_${TIMESTAMP}.png" -gravity SouthEast -geometry +0+24 -composite "frames/frame_${TIMESTAMP}.png"
          rm "frames/orig_${TIMESTAMP}.png" "frames/time_${TIMESTAMP}.png"

      - name: Nur die letzten 8 Frames behalten
        run: |
          cd frames
          ls -1 frame_*.png | sort | head -n -8 | xargs -r rm --

      - name: GIF bauen
        run: |
          ALL=$(ls -1 frames/frame_*.png | sort)
          LAST=$(echo "$ALL" | tail -n 1)
          REST=$(echo "$ALL" | head -n -1)
          convert -delay 100 -loop 0 $REST -delay 200 "$LAST" docs/wolken.gif
          touch docs/.nojekyll

      - name: CIRA Satellitenbild laden
        run: |
          mkdir -p docs
          TIMES_JSON=$(curl -s -A "Mozilla/5.0" "https://slider.cira.colostate.edu/data/json/meteosat-0deg/full_disk/geocolor/latest_times.json")
          LATEST=$(echo "$TIMES_JSON" | grep -oE '[0-9]{14}' | sort -n | tail -1)
          YEAR=${LATEST:0:4}
          MONTH=${LATEST:4:2}
          DAY=${LATEST:6:2}
          IMG_URL="https://slider.cira.colostate.edu/data/imagery/${YEAR}/${MONTH}/${DAY}/meteosat-0deg---full_disk/geocolor/${LATEST}/00/000_000.png"
          echo "Neuester Zeitstempel: $LATEST"
          echo "Bild-URL: $IMG_URL"
          curl -sL -A "Mozilla/5.0" -o "docs/eumetsat.png" "$IMG_URL"
          file "docs/eumetsat.png"

      - name: CIRA Satellitenbild laden (Test)
        run: |
          mkdir -p docs
          TIMES_JSON=$(curl -s -A "Mozilla/5.0" "https://slider.cira.colostate.edu/data/json/meteosat-0deg/full_disk/geocolor/latest_times.json")
          LATEST=$(echo "$TIMES_JSON" | grep -oE '[0-9]{14}' | sort -n | tail -1)
          YEAR=${LATEST:0:4}
          MONTH=${LATEST:4:2}
          DAY=${LATEST:6:2}
          BASE="https://slider.cira.colostate.edu/data/imagery/${YEAR}/${MONTH}/${DAY}/meteosat-0deg---full_disk/geocolor/${LATEST}/01"

          for row in 0 1; do
            for col in 0 1; do
              curl -sL -A "Mozilla/5.0" -o "docs/tile_${row}_${col}.png" "${BASE}/00${row}_00${col}.png"
            done
          done

          convert docs/tile_0_0.png docs/tile_0_1.png +append docs/row0.png
          convert docs/tile_1_0.png docs/tile_1_1.png +append docs/row1.png
          convert docs/row0.png docs/row1.png -append docs/eumetsat_test_stitched.png
          rm docs/tile_*.png docs/row*.png
          
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frames docs
          git commit -m "Update Wolken GIF" || echo "Keine Änderungen"
          git push
