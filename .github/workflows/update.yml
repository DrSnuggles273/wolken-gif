name: Update Wolken GIF

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: ImageMagick installieren
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Bild laden und zuschneiden
        run: |
          mkdir -p frames docs
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          curl -s -A "Mozilla/5.0" -o "frames/frame_${TIMESTAMP}.png" "https://www.dwd.de/DWD/wetter/sat/satwetter/njob_satrad.png"
          magick "frames/frame_${TIMESTAMP}.png" -crop 140x140+540+220 +repage "frames/frame_${TIMESTAMP}.png"

      - name: Nur die letzten 8 Frames behalten
        run: |
          cd frames
          ls -1 frame_*.png | sort | head -n -8 | xargs -r rm --

      - name: GIF bauen
        run: |
          magick -delay 100 -loop 0 $(ls -1 frames/frame_*.png | sort) docs/wolken.gif
          touch docs/.nojekyll

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frames docs
          git commit -m "Update Wolken GIF" || echo "Keine Änderungen"
          git push
