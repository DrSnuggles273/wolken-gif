      - name: EUMETSAT-Bild laden (30 Min. Verzögerung, Europa)
        run: |
          mkdir -p docs
          OLDER_TIME=$(date -u -d "30 minutes ago" +"%Y-%m-%dT%H:%M:%S.000Z")
          LOCALTIME=$(TZ='Europe/Berlin' date -d "30 minutes ago" +"%H:%M")
          echo "Angefragter Zeitpunkt: $OLDER_TIME"
          URL="https://view.eumetsat.int/geoserver/wms?service=WMS&version=1.3.0&request=GetMap&layers=mtg_fd:rgb_geocolour&styles=&crs=EPSG:4326&bbox=35.0,-25.0,60.0,37.5&width=1250&height=500&format=image/jpeg&time=${OLDER_TIME}"

          if ! curl -sL --retry 5 --retry-delay 3 --retry-all-errors --fail -o "docs/eumetsat_new.jpg" "$URL"; then
            echo "EUMETSAT-Abruf fehlgeschlagen, überspringe diesen Durchlauf (behalte altes Bild)."
            rm -f "docs/eumetsat_new.jpg"
            exit 0
          fi

          if ! convert -regard-warnings "docs/eumetsat_new.jpg" -crop 1250x500+0+0 +repage "docs/eumetsat_new.jpg" 2>/dev/null; then
            echo "EUMETSAT-Bild beschädigt, überspringe diesen Durchlauf (behalte altes Bild)."
            rm -f "docs/eumetsat_new.jpg"
            exit 0
          fi

          mv "docs/eumetsat_new.jpg" "docs/eumetsat.jpg"

          convert docs/eumetsat.jpg \
            -fill black -draw "rectangle 111,344 195,380" \
            -fill white -pointsize 28 -annotate +117+372 "$LOCALTIME" \
            -fill red -stroke white -strokewidth 1 -draw "circle 766,150 771,150" \
            docs/eumetsat.jpg
          file "docs/eumetsat.jpg"
          
