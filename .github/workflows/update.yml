name: Update Wolken GIF

on:
  
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: ImageMagick installieren
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Bild laden und zuschneiden
        run: |
          mkdir -p frames docs
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          LOCALTIME=$(TZ='Europe/Berlin' date +"%H:%M")
          curl -s -A "Mozilla/5.0" -o "frames/orig_${TIMESTAMP}.png" "https://www.dwd.de/DWD/wetter/sat/satwetter/njob_satrad.png"
          convert "frames/orig_${TIMESTAMP}.png" -crop 140x140+540+220 +repage "frames/frame_${TIMESTAMP}.png"
          convert -size 40x16 xc:black -fill white -gravity center -pointsize 12 -annotate 0 "$LOCALTIME" "frames/time_${TIMESTAMP}.png"
          convert "frames/frame_${TIMESTAMP}.png" "frames/time_${TIMESTAMP}.png" -gravity SouthEast -geometry +0+24 -composite "frames/frame_${TIMESTAMP}.png"
          rm "frames/orig_${TIMESTAMP}.png" "frames/time_${TIMESTAMP}.png"

      - name: Nur die letzten 8 Frames behalten
        run: |
          cd frames
          ls -1 frame_*.png | sort | head -n -8 | xargs -r rm --

      - name: GIF bauen
        run: |
          ALL=$(ls -1 frames/frame_*.png | sort)
          LAST=$(echo "$ALL" | tail -n 1)
          REST=$(echo "$ALL" | head -n -1)
          convert -delay 100 -loop 0 $REST -delay 200 "$LAST" docs/wolken.gif
          touch docs/.nojekyll

      - name: FU-Berlin Webcam (Dahlem NNO) laden
        run: |
          mkdir -p docs
          BASE="https://wind.met.fu-berlin.de/storage/webcams/metfubcm02/webcam_metfubcm02_"
          NOW_EPOCH=$(date +%s)
          ROUNDED_EPOCH=$(( NOW_EPOCH - (NOW_EPOCH % 600) ))
          FOUND=0
          for i in 0 1 2 3 4 5; do
            T_EPOCH=$(( ROUNDED_EPOCH - i*600 ))
            T=$(TZ='Europe/Berlin' date -d "@$T_EPOCH" +"%Y%m%d_%H%M")
            URL="${BASE}${T}.jpg"
            STATUS=$(curl -s -o /tmp/webcam.jpg -w "%{http_code}" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36" \
              -H "Referer: https://wind.met.fu-berlin.de/webcams/5" \
              -H "Accept: image/avif,image/webp,image/apng,image/*,*/*;q=0.8" \
              "$URL")
            echo "Versuch $i ($URL): HTTP $STATUS"
            if [ "$STATUS" == "200" ]; then
              cp /tmp/webcam.jpg docs/webcam_dahlem_nno.jpg
              echo "Verwendet: $URL"
              FOUND=1
              break
            fi
          done
          if [ "$FOUND" == "0" ]; then
            echo "Kein aktuelles Webcam-Bild gefunden, docs/webcam_dahlem_nno.jpg bleibt unverändert."
          fi
          
      - name: NASA-Satellitenbild laden (Europa)
        run: |
          mkdir -p docs
          TODAY=$(date -u +"%Y-%m-%d")
          URL="https://wvs.earthdata.nasa.gov/api/v1/snapshot?REQUEST=GetSnapshot&TIME=${TODAY}&BBOX=35,-15,60,47.5&CRS=EPSG:4326&LAYERS=VIIRS_SNPP_CorrectedReflectance_TrueColor,Coastlines&FORMAT=image/png&WIDTH=1250&HEIGHT=500"
          echo "URL: $URL"
          curl -sL -A "Mozilla/5.0" -o "docs/nasa.png" "$URL"
          file "docs/nasa.png"
          
