name: Update EUMETSAT-Bild

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: ImageMagick installieren
        run: |
          if command -v convert > /dev/null 2>&1; then
            echo "ImageMagick bereits vorhanden."
            exit 0
          fi
          for i in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
               && sudo apt-get install -y -o Acquire::Retries=3 imagemagick; then
              exit 0
            fi
            echo "Installation fehlgeschlagen (Versuch $i), warte 15 Sekunden..."
            sleep 15
          done
          exit 1

      - name: EUMETSAT-Bild laden (30 Min. Verzögerung, Europa)
        run: |
          mkdir -p docs
          OLDER_TIME=$(date -u -d "30 minutes ago" +"%Y-%m-%dT%H:%M:%S.000Z")
          LOCALTIME=$(TZ='Europe/Berlin' date -d "30 minutes ago" +"%H:%M")
          echo "Angefragter Zeitpunkt: $OLDER_TIME"
          URL="https://view.eumetsat.int/geoserver/wms?service=WMS&version=1.3.0&request=GetMap&layers=mtg_fd:rgb_geocolour&styles=&crs=EPSG:4326&bbox=35.0,-25.0,60.0,37.5&width=1250&height=500&format=image/jpeg&time=${OLDER_TIME}"

          if ! curl -sL --retry 5 --retry-delay 3 --retry-all-errors --fail -o "docs/eumetsat_new.jpg" "$URL"; then
            echo "EUMETSAT-Abruf fehlgeschlagen, überspringe diesen Durchlauf (behalte altes Bild)."
            rm -f "docs/eumetsat_new.jpg"
            exit 0
          fi

          if ! convert -regard-warnings "docs/eumetsat_new.jpg" -crop 1250x500+0+0 +repage "docs/eumetsat_new.jpg" 2>/dev/null; then
            echo "EUMETSAT-Bild beschädigt, überspringe diesen Durchlauf (behalte altes Bild)."
            rm -f "docs/eumetsat_new.jpg"
            exit 0
          fi

          mv "docs/eumetsat_new.jpg" "docs/eumetsat.jpg"

          convert docs/eumetsat.jpg \
            -fill black -draw "rectangle 111,344 195,380" \
            -fill white -pointsize 28 -annotate +117+372 "$LOCALTIME" \
            -fill red -stroke white -strokewidth 1 -draw "circle 766,150 771,150" \
            docs/eumetsat.jpg
          file "docs/eumetsat.jpg"

      - name: Meteosat-Aktualität prüfen und ggf. benachrichtigen
        run: |
          LATEST=$(curl -s --max-time 20 -A "Mozilla/5.0" "https://slider.cira.colostate.edu/data/json/meteosat-12/full_disk/geocolor/latest_times.json?_=$(date +%s)" | grep -oE '[0-9]{14}' | sort -n | tail -1 || true)

          if [ -z "$LATEST" ]; then
            echo "CIRA-Zeitstempel nicht abrufbar, überspringe Prüfung."
            exit 0
          fi

          LATEST_EPOCH=$(date -u -d "${LATEST:0:8} ${LATEST:8:2}:${LATEST:10:2}:${LATEST:12:2}" +%s)
          NOW_EPOCH=$(date -u +%s)
          AGE=$(( (NOW_EPOCH - LATEST_EPOCH) / 60 ))
          echo "Neuester Meteosat-Zeitstempel: $LATEST (Alter: ${AGE} Minuten)"

          if [ "$AGE" -lt 60 ]; then
            if [ ! -f docs/.meteosat_notified ]; then
              curl -s -d "Meteosat-Live-Bild ist wieder aktuell! (Stand: $LATEST)" "https://ntfy.sh/ringo-meteosat-check-2026"
              touch docs/.meteosat_notified
              echo "Benachrichtigung gesendet."
            else
              echo "Bereits benachrichtigt, überspringe."
            fi
          else
            rm -f docs/.meteosat_notified
            echo "Weiterhin veraltet, keine Aktion."
          fi

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Update EUMETSAT-Bild" || echo "Keine Änderungen"
          git pull --rebase origin main

          for i in 1 2 3; do
            if git push; then
              echo "Push erfolgreich."
              break
            else
              echo "Push fehlgeschlagen (Versuch $i), warte 10 Sekunden..."
              sleep 10
            fi
          done
